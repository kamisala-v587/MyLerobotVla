[project]
name = "lerobot_policy_demo"
version = "0.1.0"
description = "Custom LeRobot policy plugin (skeleton)"
requires-python = ">=3.10"
dependencies = [
    "lerobot",
    "torch",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lerobot_policy_demo"]
